<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Incidents in Financial Services — 2026</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #040508;
      --surface: #0d1117;
      --surface2: #161b22;
      --teal: #00d4c8;
      --teal-dim: #00a89e;
      --teal-glow: rgba(0, 212, 200, .15);
      --white: #fff;
      --w90: rgba(255, 255, 255, .9);
      --w70: rgba(255, 255, 255, .7);
      --w50: rgba(255, 255, 255, .5);
      --w20: rgba(255, 255, 255, .12);
      --w10: rgba(255, 255, 255, .06);
      --border: rgba(0, 212, 200, .18);
      --border2: rgba(0, 212, 200, .35);
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --slide-transition: .55s cubic-bezier(.4, 0, .2, 1);
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #fff;
      --surface2: #f0f0f5;
      --white: #1d1d1f;
      --w90: rgba(0, 0, 0, .85);
      --w70: rgba(0, 0, 0, .65);
      --w50: rgba(0, 0, 0, .45);
      --w20: rgba(0, 0, 0, .1);
      --w10: rgba(0, 0, 0, .04);
      --border: rgba(0, 180, 172, .25);
      --border2: rgba(0, 180, 172, .5);
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font)
    }

    body {
      background: var(--bg);
      color: var(--white);
      transition: background .4s, color .4s
    }

    /* ── Stage & Slides ── */
    #stage {
      position: fixed;
      inset: 0;
      background: var(--bg)
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 100px 100px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(24px);
      transition: opacity var(--slide-transition), transform var(--slide-transition);
      overflow: hidden;
    }

    .slide.active {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0)
    }

    .slide.exit-up {
      opacity: 0;
      transform: translateY(-24px)
    }

    .slide.exit-down {
      opacity: 0;
      transform: translateY(24px)
    }

    /* ── Noise / glow ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0, 212, 200, .07) 0%, transparent 60%);
    }

    /* ── HUD ── */
    .hud {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(13, 17, 23, .82);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 10px 20px;
      backdrop-filter: blur(20px);
      z-index: 1000;
      transition: opacity .3s;
    }

    .hud-dots {
      display: flex;
      gap: 7px;
      align-items: center
    }

    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--w20);
      border: none;
      cursor: pointer;
      transition: all .3s;
    }

    .hud-dot.on {
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
      transform: scale(1.3)
    }

    .hud-dot:hover:not(.on) {
      background: var(--w50)
    }

    .hud-sep {
      width: 1px;
      height: 18px;
      background: var(--w20)
    }

    .hud-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--w50);
      font-size: 16px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .2s, background .2s;
    }

    .hud-btn:hover {
      color: var(--teal);
      background: var(--teal-glow)
    }

    /* ── Slide counter ── */
    .slide-counter {
      position: fixed;
      top: 28px;
      right: 36px;
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--w50);
      letter-spacing: .1em;
      z-index: 1000;
    }

    .slide-counter span {
      color: var(--teal)
    }

    /* ── Typography ── */
    .eyebrow {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--teal);
      letter-spacing: .22em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .eyebrow::after {
      content: '';
      flex: 1;
      max-width: 48px;
      height: 1px;
      background: var(--teal-dim)
    }

    .headline {
      font-size: clamp(2.4rem, 5.5vw, 5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.02em;
      margin-bottom: 20px;
    }

    .accent {
      color: var(--teal)
    }

    .subline {
      font-size: clamp(.95rem, 1.6vw, 1.2rem);
      color: var(--w70);
      line-height: 1.7;
      font-weight: 300;
      max-width: 660px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px;
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }

    .card:hover {
      border-color: var(--border2);
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(0, 212, 200, .08);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 8px
    }

    .card-body {
      font-size: .88rem;
      color: var(--w70);
      line-height: 1.65
    }

    /* ── Grids ── */
    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px
    }

    .g5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px
    }

    /* ── KPI ── */
    .kpi {
      text-align: center;
      background: rgba(0, 212, 200, .04);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 12px;
      transition: all .3s;
    }

    .kpi:hover {
      background: rgba(0, 212, 200, .08);
      transform: translateY(-2px)
    }

    .kpi-value {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--teal);
      line-height: 1;
      margin-bottom: 6px
    }

    .kpi-label {
      font-size: .7rem;
      color: var(--w50);
      text-transform: uppercase;
      letter-spacing: .1em
    }

    /* ── Table ── */
    .tbl {
      width: 100%;
      border-collapse: collapse
    }

    .tbl th {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--teal);
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .tbl td {
      padding: 11px 14px;
      font-size: .86rem;
      color: var(--w70);
      border-bottom: 1px solid var(--w10);
    }

    .tbl tr:hover td {
      background: rgba(0, 212, 200, .03)
    }

    /* ── Pipeline ── */
    .pipeline {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      margin: 28px 0
    }

    .pipe {
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      padding: 18px 14px;
      text-align: center;
      position: relative;
      transition: all .3s;
    }

    .pipe:last-child {
      border-right: 1px solid var(--border)
    }

    .pipe:hover {
      background: rgba(0, 212, 200, .05);
      border-color: var(--border2)
    }

    .pipe::after {
      content: '→';
      position: absolute;
      right: -13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--teal);
      font-size: .9rem;
      z-index: 2;
    }

    .pipe:last-child::after {
      content: ''
    }

    .pipe-nb {
      font-family: var(--mono);
      font-size: .58rem;
      color: var(--teal);
      letter-spacing: .15em;
      margin-bottom: 7px
    }

    .pipe-t {
      font-weight: 600;
      font-size: .88rem;
      margin-bottom: 5px
    }

    .pipe-d {
      font-size: .72rem;
      color: var(--w50);
      line-height: 1.5
    }

    .pipe-o {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--w10);
      font-family: var(--mono);
      font-size: .6rem;
      color: var(--teal-dim)
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 212, 200, .1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--teal);
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px
    }

    /* ── Roadmap ── */
    .roadmap-item {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid var(--w10)
    }

    .roadmap-item:last-child {
      border-bottom: none
    }

    .roadmap-dot {
      width: 10px;
      height: 10px;
      min-width: 10px;
      border-radius: 50%;
      background: var(--teal);
      margin-top: 4px;
      box-shadow: 0 0 8px var(--teal)
    }

    .roadmap-dot.dim {
      background: var(--w20);
      box-shadow: none
    }

    .roadmap-title {
      font-size: .9rem;
      font-weight: 500;
      margin-bottom: 3px
    }

    .roadmap-desc {
      font-size: .8rem;
      color: var(--w50)
    }

    /* ── Code block ── */
    .code {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: .76rem;
      color: #b8f0ec;
      line-height: 1.7;
      overflow-x: auto;
    }

    /* ── Highlight box ── */
    .hl {
      background: rgba(0, 212, 200, .05);
      border: 1px solid var(--border);
      border-left: 3px solid var(--teal);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: .88rem;
      color: var(--w70);
      line-height: 1.6;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .animate {
      animation: fadeUp .6s cubic-bezier(.22, 1, .36, 1) both
    }

    .d1 {
      animation-delay: .08s
    }

    .d2 {
      animation-delay: .16s
    }

    .d3 {
      animation-delay: .24s
    }

    .d4 {
      animation-delay: .32s
    }

    .d5 {
      animation-delay: .4s
    }

    /* ── Hero bg ── */
    .hero-glow {
      position: absolute;
      right: -8%;
      top: 50%;
      transform: translateY(-50%);
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(0, 212, 200, .1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      border: 1px solid var(--border);
    }

    .hero-glow::after {
      content: '';
      position: absolute;
      inset: 60px;
      border: 1px solid rgba(0, 212, 200, .08);
      border-radius: 50%;
    }

    /* ── Swipe indicator ── */
    .swipe-hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: .6rem;
      color: var(--w20);
      letter-spacing: .18em;
      text-transform: uppercase;
      animation: fadeUp 1s ease 2s both;
      pointer-events: none;
    }

    /* ── Fullscreen mode ── */
    :fullscreen #stage,
    .slide {
      background: var(--bg)
    }

    :fullscreen .hud {
      bottom: 24px
    }

    /* ── Bar chart ── */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px
    }

    .bar-label {
      font-size: .76rem;
      color: var(--w70);
      min-width: 160px;
      font-weight: 400
    }

    .bar-track {
      flex: 1;
      height: 5px;
      background: var(--w10);
      border-radius: 3px;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--teal-dim));
      border-radius: 3px
    }

    .bar-val {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--teal);
      min-width: 36px;
      text-align: right
    }

    @media(max-width:900px) {
      .slide {
        padding: 70px 28px 90px
      }

      .g2,
      .g3,
      .g4,
      .g5 {
        grid-template-columns: 1fr
      }

      .pipeline {
        grid-template-columns: 1fr
      }

      .pipe {
        border-right: 1px solid var(--border);
        border-bottom: none
      }

      .pipe:last-child {
        border-bottom: 1px solid var(--border)
      }

      .pipe::after {
        content: '↓';
        right: 50%;
        bottom: -13px;
        top: auto;
        transform: translateX(50%)
      }

      .pipe:last-child::after {
        content: ''
      }
    }
  </style>
</head>

<body data-theme="dark">

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const SLIDES = [

    ];
    const LABELS = [
      'Cover', 'Problem', 'Solution', 'Data', 'Pipeline',
      'ML', 'API', 'Groq', 'Architecture', 'Deploy', 'Roadmap', 'Conclusion'
    ];

    /* ── Shared components ── */
    function Eyebrow({ n, label }) {
      return (
        <div className="eyebrow animate">
          <span style={{ fontFamily: 'var(--mono)', color: 'var(--teal)' }}>
            {String(n).padStart(2, '0')}
          </span>
          <span style={{ color: 'var(--w50)' }}>{label}</span>
        </div>
      );
    }

    /* ═══════ SLIDES ═══════ */

    function SlideHero({ className }) {
      return (
        <div className={className || "slide"} id="hero">
          <div className="hero-glow" />
          <Eyebrow n={1} label="INTRODUCTION · PUC-SP · 2026" />

            AI Incidents in<br />
            <span className="accent">Financial Services</span>
          </h1>

          </p>
          <div className="badge-row animate d3">
            {['CRISP-DM', 'Python 3.10', 'XGBoost', 'Flask REST', 'Streamlit', 'SQLite', 'Groq llama-3.1'].map(b => (
              <span key={b} className="badge">{b}</span>
            ))}
          </div>
          <p style={{ marginTop: 40, fontFamily: 'var(--mono)', fontSize: '.65rem', color: 'var(--w20)', letterSpacing: '.14em' }} className="animate d4">
            USE ← → KEYS OR SWIPE TO NAVIGATE
          </p>
        </div>
      );
    }

    function SlideProblem({ className }) {
      const cases = [
        { icon: '💥', t: 'Flash Crash · 2010', d: 'Faulty trading algorithm erased ~$1 trillion in 36 min' },
        { icon: '⚖️', t: 'Apple Card · 2019', d: 'Credit model granted 20× higher limits to men — SEC/FTC case' },

      ];
      return (
        <div className={className || "slide"} id="problem">
          <Eyebrow n={2} label="THE PROBLEM" />
          <div className="g2" style={{ gap: 48, alignItems: 'flex-start' }}>
            <div>
              <h2 className="headline animate d1" style={{ fontSize: 'clamp(2rem,4vw,3.2rem)', marginBottom: 16 }}>
                AI failures cost<br /><span className="accent">billions</span> —<br />
                no systemic tracking
              </h2>
              <p className="subline animate d2" style={{ marginBottom: 24 }}>
                Real AI incidents in financial services cause massive losses, discrimination,
                and market instability — but remain fragmented and unanalyzed.
              </p>
              <div className="hl animate d3">
                <strong style={{ color: 'var(--teal)' }}>Critical gap:</strong> no public consolidated base of
                financial AI incidents with statistical analysis, derived features, and predictive capability.
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }} className="animate d2">
              {cases.map(c => (
                <div key={c.t} className="card" style={{ padding: '16px 20px' }}>
                  <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
                    <span style={{ fontSize: '1.6rem' }}>{c.icon}</span>
                    <div>
                      <div className="card-title" style={{ fontSize: '.95rem', marginBottom: 4 }}>{c.t}</div>

                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function SlideSolution({ className }) {
      const items = [
        { nb: 'NB1', icon: '📊', t: 'Analytical Base', d: '31 filtered incidents, 8 derived variables, relational SQLite database' },
        { nb: 'NB2', icon: '📈', t: 'Statistical Analysis', d: 'H1–H4: chi-square, Spearman, logistic regression with Odds Ratio' },
        { nb: 'NB3', icon: '🤖', t: 'ML Models', d: 'LR + RF + XGBoost serialized and ready for serving' },
        { nb: 'NB4', icon: '🚀', t: 'REST API', d: 'Flask 9 endpoints: historical data, statistics, real-time predictions' },
        { nb: 'APP', icon: '🖥️', t: 'Dashboard', d: 'Streamlit 7 pages, dark mode, Plotly, integrated Groq chatbot' },
      ];
      return (
        <div className={className || "slide"} id="solution">
          <Eyebrow n={3} label="SOLUTION" />
          <h2 className="headline animate d1" style={{ fontSize: 'clamp(2rem,4vw,3rem)', marginBottom: 16 }}>
            End-to-end <span className="accent">CRISP-DM</span> pipeline
          </h2>
          <p className="subline animate d2" style={{ marginBottom: 28 }}>
            From raw collection to intelligent prediction — fully integrated architecture.
          </p>
          <div className="g5 animate d3">
            {items.map(i => (
              <div key={i.nb} className="card" style={{ textAlign: 'center', padding: '20px 14px' }}>
                <div style={{ fontFamily: 'var(--mono)', fontSize: '.6rem', color: 'var(--teal)', marginBottom: 8, letterSpacing: '.15em' }}>{i.nb}</div>
                <div style={{ fontSize: '2rem', marginBottom: 10 }}>{i.icon}</div>
                <div className="card-title" style={{ fontSize: '.9rem' }}>{i.t}</div>
                <div className="card-body" style={{ fontSize: '.78rem' }}>{i.d}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SlideData({ className }) {
      const kpis = [
        { v: '31', l: 'Financial\nIncidents' },
        { v: '8', l: 'Derived\nVariables' },
        { v: '2003', l: 'Series\nStart' },
        { v: '2023', l: 'Series\nEnd' },
        { v: '30+', l: 'Financial\nKeywords' },
        { v: '3', l: 'SQLite\nTables' },
      ];
      const bars = [
        { l: 'credit_scoring', p: 29 }, { l: 'fraud_detection', p: 23 },
        { l: 'algorithmic_trading', p: 19 }, { l: 'risk_assessment', p: 13 },
        { l: 'robo_advisor', p: 10 }, { l: 'customer_service', p: 6 },
      ];
      return (
        <div className={className || "slide"} id="data">
          <Eyebrow n={4} label="DATA & FEATURES" />
          <div className="g2 animate d1" style={{ gap: 40, alignItems: 'flex-start' }}>
            <div>
              <h2 className="headline" style={{ fontSize: 'clamp(1.8rem,3.5vw,2.8rem)', marginBottom: 20 }}>
                Feature Engineering<br />by <span className="accent">semantic inference</span>
              </h2>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12, marginBottom: 24 }}>
                {kpis.map(k => (

            <p style={{ fontFamily: 'var(--mono)', fontSize: '.62rem', color: 'var(--w20)', letterSpacing: '.14em' }}>
              CRISP-DM · PYTHON · FLASK · STREAMLIT · XGBOOST · GROQ
            </p>
          </div>
        </div>
      );
    }

    /* ═══════ APP ═══════ */
    function App() {
      const [cur, setCur] = useState(0);
      const [theme, setTheme] = useState('dark');
      const [dir, setDir] = useState('next');
      const touchStart = useRef(null);
      const isAnimating = useRef(false);

      const go = useCallback((idx) => {
        if (isAnimating.current || idx === cur || idx < 0 || idx >= SLIDES.length) return;
        setDir(idx > cur ? 'next' : 'prev');
        isAnimating.current = true;
        setCur(idx);
        setTimeout(() => { isAnimating.current = false }, 600);
      }, [cur]);

      // Keyboard
      useEffect(() => {
        const h = (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1);
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1);
          else if (e.key === 'f' || e.key === 'F') {
            document.fullscreenElement
              ? document.exitFullscreen()
              : document.getElementById('stage').requestFullscreen();
          }
          else if (e.key === 'r' || e.key === 'R') go(0);
          else if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, [cur, go]);

      // Touch swipe
      useEffect(() => {
        const s = (e) => { touchStart.current = e.touches[0].clientX };
        const e = (e) => {
          if (!touchStart.current) return;
          const dx = touchStart.current - e.changedTouches[0].clientX;
          if (Math.abs(dx) > 50) { dx > 0 ? go(cur + 1) : go(cur - 1); }
          touchStart.current = null;
        };
        window.addEventListener('touchstart', s, { passive: true });
        window.addEventListener('touchend', e, { passive: true });
        return () => { window.removeEventListener('touchstart', s); window.removeEventListener('touchend', e) };
      }, [cur, go]);

      // Theme sync
      useEffect(() => { document.body.setAttribute('data-theme', theme) }, [theme]);

      const toggleFullscreen = () => {
        document.fullscreenElement
          ? document.exitFullscreen()
          : document.getElementById('stage').requestFullscreen();
      };

      const slideComponents = [
        SlideHero, SlideProblem, SlideSolution, SlideData, SlidePipeline,
        SlideML, SlideAPI, SlideGroq, SlideArch, SlideDeploy, SlideRoadmap, SlideConclusion
      ];

      return (
        <>
          {/* Slide counter */}
          <div className="slide-counter" style={{ zIndex: 1001 }}>
            <span>{String(cur + 1).padStart(2, '0')}</span> / {String(SLIDES.length).padStart(2, '0')}
            &emsp;<span style={{ color: 'var(--w50)', fontSize: '.65rem' }}>{LABELS[cur]}</span>
          </div>

          {/* Slides */}
          {slideComponents.map((Comp, i) => {
            let cls = 'slide';
            if (i === cur) cls += ' active';
            else if (i < cur) cls += ' exit-up';
            return <Comp key={i} className={cls} style={{}} />;
          })}

          {/* HUD */}
          <div className="hud">
            <div className="hud-dots">
              {SLIDES.map((_, i) => (
                <button key={i} className={`hud-dot${i === cur ? ' on' : ''}`} onClick={() => go(i)} title={LABELS[i]} />
              ))}
            </div>
            <div className="hud-sep" />
            <button className="hud-btn" onClick={() => go(cur - 1)} title="Previous" disabled={cur === 0}>◀</button>
            <button className="hud-btn" onClick={() => go(cur + 1)} title="Next" disabled={cur === SLIDES.length - 1}>▶</button>
            <button className="hud-btn" onClick={() => go(0)} title="Restart (R)">↺</button>
            <button className="hud-btn" onClick={toggleFullscreen} title="Fullscreen (F)">⛶</button>
            <button className="hud-btn" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title="Toggle theme">
              {theme === 'dark' ? '☀' : '🌙'}
            </button>
            <button className="hud-btn" onClick={exportPPT} title="Download PPTX" style={{ fontWeight: 600, color: "var(--teal)" }}>⬇ Download PPTX</button>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('stage')).render(<App />);

    async function exportPPT() {
      const btn = document.querySelector('[title="Download PPTX"]');
      if (btn) btn.textContent = '⏳';
      document.querySelectorAll('.animate').forEach(el => {
        el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none';
      });
      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';
      const slides = document.querySelectorAll('.slide.active, .slide');
      const all = [...document.querySelectorAll('.slide')];
      const hud = document.querySelector('.hud');
      const ctr = document.querySelector('.slide-counter');
      if (hud) hud.style.opacity = '0';
      if (ctr) ctr.style.opacity = '0';
      for (let i = 0; i < all.length; i++) {
        const el = all[i];
        const origCls = el.className;
        el.className = 'slide active';
        const canvas = await html2canvas(el, {
          width: 1920, height: 1080, scale: 1,
          backgroundColor: document.body.getAttribute('data-theme') === 'dark' ? '#040508' : '#f5f5f7',
          windowWidth: 1920, windowHeight: 1080, logging: false,
        });
        el.className = origCls;
        const s = pptx.addSlide();
        s.background = { color: document.body.getAttribute('data-theme') === 'dark' ? '040508' : 'f5f5f7' };
        s.addImage({ data: canvas.toDataURL('image/png', .95), x: 0, y: 0, w: '100%', h: '100%' });
      }
      if (hud) hud.style.opacity = '1';
      if (ctr) ctr.style.opacity = '1';
      pptx.writeFile({ fileName: 'AI_Incidents_Financial_Services_EN.pptx' });
      if (btn) btn.textContent = '⬇ Download PPTX';
    }
  </script>
</body>

</html>
